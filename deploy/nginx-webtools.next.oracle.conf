# /etc/nginx/sites-available/webtools.wiki
# Requires: Next.js on 127.0.0.1:4321  +  certbot after DNS points here

server {
    listen 80;
    listen [::]:80;
    server_name webtools.wiki www.webtools.wiki;

    # Video file responses can be large
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # yt-dlp fetches / merges can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
